[build-system]
requires = ["setuptools>=68,<80"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-agyx"
version = "2.4.0"
description = "Hermes-native AGY (Antigravity/Code Assist) tool: text, file read/write, image analysis, image generation, and a self-healing coding loop via the user's paid agy OAuth login."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Peter" }]
keywords = ["hermes", "agy", "antigravity", "gemini", "coding-agent", "image-generation"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]
# Runtime uses ONLY the Python standard library (urllib, subprocess, fcntl).
# No third-party install is required for the tool to run.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7,<9", "pytest-xdist>=3,<4"]

[project.urls]
Homepage = "https://github.com/lesterppo/hermes-agyx"
Repository = "https://github.com/lesterppo/hermes-agyx"

[tool.setuptools]
packages = ["agyx_plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
