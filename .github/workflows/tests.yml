name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run network-free tests
        # Tests mock agy/subprocess/Gemini — they must NOT touch the network
        # or any credentials. CI should fail if a test tries to hit the network.
        env:
          HERMES_HOME: /tmp/hermes-agyx-ci-home
          GEMINI_API_KEY: ""
        run: pytest -q
